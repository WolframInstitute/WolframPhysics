<!DOCTYPE html>
<!-- The notebook host the shell frames for a documentation page, deployed beside index.html by
     scripts/build_site.wls for the target "site" only. scripts/build_site.wls fills the three slots
     (BASE, DOCS, IDS), so nothing else here may carry a backtick. BASE and DOCS are the same values
     the shell's loader is given, so the two agree on where a page lives; IDS is the list of the
     pages in the tree, which is what makes a link one of ours. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wolfram Physics</title>
<style>
  /* The notebook embedder is built for a document whose WINDOW scrolls: its lazy rendering keys
     off window scroll, and hosting it inside an overflow:auto div freezes it. Here it lives in
     normal flow, exactly as on the resource's own pages: the cloud's static pre-render is
     injected INTO the container the embedder is then given, and hydrates in place, so only the
     dynamic elements change as they come alive. */
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; }
  #notebook-embed { padding: 0 24px 48px; }
  #notebook-embed .notebook-html { display: block; }
  #err {
    display: none; margin: 40vh auto 0; max-width: 420px; text-align: center;
    font: 14px/1.5 "Source Sans Pro", -apple-system, sans-serif; color: #666;
  }
  @media (max-width: 900px) { #notebook-embed { padding: 0 14px 40px; } }
</style>
</head>
<body>
<div id="notebook-embed"></div>
<div id="err">This page could not be loaded.</div>
<script>
(function () {
  var BASE = '`BASE`', DOCS = '`DOCS`', IDS = `IDS`,
      node = document.getElementById('notebook-embed'),
      m = (new URLSearchParams(location.search).get('p') || '')
            .match(/^(guide|ref|tutorial)\/([A-Za-z0-9]+)$/),
      id = m ? (m[1] + '/' + m[2]) : '';
  if (!id || IDS.indexOf(id) < 0) { document.getElementById('err').style.display = 'block'; return; }
  var nbURL = BASE + DOCS + id + '.nb',
      /* the endpoint the paclet pipeline itself computes, with the width of this frame rounded
         to 100px buckets so the cloud's per-width render cache actually gets hits */
      w = Math.round(Math.min(1400, Math.max(500, document.documentElement.clientWidth - 48)) / 100) * 100,
      staticURL = nbURL.replace('/obj/', '/statichtml/') + '?maxwaitmillis=8000&width=' + w;
  document.title = m[2];

  function hydrate() {
    var sc = document.createElement('script');
    sc.crossOrigin = 'anonymous';
    sc.src = 'https://www.wolframcdn.com/notebook-embedder/0.3/wolfram-notebook-embedder.min.js';
    sc.onload = function () {
      window.WolframNotebookEmbedder.embed(nbURL, node, { showRenderProgress: false });
    };
    document.head.appendChild(sc);
  }

  fetch(staticURL, { credentials: 'omit' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .catch(function () { return ''; })
    .then(function (html) {
      if (html) {
        node.innerHTML = html;
        var nh = node.querySelector('.notebook-html');
        if (nh) { nh.style.display = 'block'; }   /* paint the pre-render now, not on embedder timing */
      }
      hydrate();
    });

  /* A link to another page of this tree, on this origin, stays inside the shell: hand the
     navigation up rather than reloading this frame blind. Any other link keeps its own
     navigation, and one to another site opens in a new tab, so a reference to Wolfram's own
     documentation is never rewritten into a page this resource does not have. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) { return; }
    var lm = (a.getAttribute('href') || '')
          .match(/\/(guide|ref|tutorial)\/([A-Za-z0-9]+)\.(?:html|nb)(?:[?#].*)?$/),
        t = lm ? (lm[1] + '/' + lm[2]) : '',
        origin = '';
    try { origin = new URL(a.href, location.href).origin; } catch (err) {}
    if (!t || IDS.indexOf(t) < 0 || origin !== location.origin) {
      if (/^https?:$/.test(a.protocol) && origin !== location.origin) { a.target = '_blank'; a.rel = 'noopener'; }
      return;
    }
    e.preventDefault();
    if (window.parent !== window) { window.parent.postMessage({ wpNav: t }, location.origin); }
    else { location.search = '?p=' + t; }
  });
})();
</script>
</body>
</html>
